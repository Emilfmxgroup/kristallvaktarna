  sc = Math.min(innerWidth / W, innerHeight / H);

const SAVE_KEY = 'kaninvaktarna-v1';
let save = { stars: [0, 0, 0, 0, 0], muted: false, seen: {}, story: false, rabbits: null, run: null };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && Array.isArray(s.stars)) save = Object.assign(save, s);
} catch (e) {}
if (!Array.isArray(save.rabbits)) {
  // older saves unlocked rabbits by clearing levels
  save.rabbits = [0, 1];
  [[0, 2], [1, 3], [2, 4], [3, 5]].forEach(([lv, i]) => { if (save.stars[lv] > 0) save.rabbits.push(i); });
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const cleared = i => save.stars[i] > 0;
const levelUnlocked = i => i === 0 || cleared(i - 1);
const rabbitUnlocked = i => save.rabbits.includes(i);
const totalStars = () => save.stars.reduce((a, b) => a + b, 0);

// ---------- audio ----------
let ac = null; const lastSfx = {};
function sfx(f, d = .08, type = 'square', vol = .04, slide = 0, key) {
  if (save.muted) return;
  const now = performance.now();
  if (key) { if (now - (lastSfx[key] || 0) < 60) return; lastSfx[key] = now; }
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(gn); gn.connect(ac.destination); o.start(); o.stop(t + d);
  } catch (e) {}
}

    drawBossBalloon(W / 2, y + 90 + Math.sin(T * 2) * 4, b, {}, false, 1.1);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5; rr(W / 2 + 40, y + 24, 170, 46, 12); ctx.fill(); ctx.stroke();
    para(b.win, W / 2 + 125, y + 40, 150, 13, INK, 'center');
    txt('TIPS', W / 2, y + 170, 16, '#c2410c', 'center', null);
    y = para(endInfo.tip, W / 2, y + 198, 360, 16, INK, 'center') + 10;
  }
  y = Math.max(y + 10, 540);
  if (win && g.lv + 1 < LEVELS.length) { btn(110, y, 320, 60, 'NÄSTA BANA', '#3fbf5a', () => startLevel(g.lv + 1), { size: 21 }); y += 72; }
  btn(110, y, 320, 60, 'SPELA IGEN', '#ff9b21', () => startLevel(g.lv), { size: 21 }); y += 72;
  btn(110, y, 320, 60, 'MENY', '#4d8dff', () => { scene = 'menu'; }, { size: 21 });
}

// ---------- input ----------
function toLocal(e) { return { x: (e.clientX - ox) / sc, y: (e.clientY - oy) / sc }; }
function gridCell(x, y) {
  if (y < GY || y >= PY || x < 0 || x >= W) return null;
  return { c: Math.floor(x / CS), r: Math.floor((y - GY) / CS) };
}
function tapGrid(x, y) {
  const cell = gridCell(x, y); if (!cell) return;
  const { c, r } = cell; g.hover = cell;
  if (g.moving) {
    const t = g.moving, mc = moveCost(t);
    if (t.c === c && t.r === r) { g.moving = null; return; }
    if (!canBuild(c, r)) { sfx(150, .1, 'sawtooth'); return; }
    if (g.gold < mc) { pop(x, y, 'FÖR LITE ¢', '#ff8a8a'); sfx(150, .12, 'sawtooth'); g.moving = null; return; }
    g.gold -= mc; burst(t.x, t.y + 10, '#c9a26b', 6, 80);
    Object.assign(t, { c, r, x: c * CS + CS / 2, y: GY + r * CS + CS / 2, hop: .5, cd: .5 });
    g.moving = null; g.sel = t;
    burst(t.x, t.y + 10, '#c9a26b', 8, 90); say(t, pick(LINES.move)); sfx(500, .15, 'triangle', .05, 300);
    return;
  }
  const t = g.towers.find(t => t.c === c && t.r === r);
  if (t) { g.sel = t; g.armed = -1; t.hop = .4; sfx(520, .05); return; }
  if (g.armed < 0) { g.sel = null; return; }
  const R = RABBITS[g.armed];
  if (!canBuild(c, r)) { sfx(150, .1, 'sawtooth'); return; }
  if (g.gold < R.cost) { pop(x, y, 'FÖR LITE ¢', '#ff8a8a'); sfx(150, .12, 'sawtooth'); return; }
  g.gold -= R.cost;
  const nt = { type: g.armed, c, r, x: c * CS + CS / 2, y: GY + r * CS + CS / 2, lvl: 1, cd: 0, ang: -0.5, invested: R.cost, mode: 'first', sees: false,
    name: pick(NAMES), pops: 0, seed: Math.random() * 10, kick: 0, hop: .5, rangeUp: false };
  nt.s = stats(nt); g.towers.push(nt);
  say(nt, pick(LINES.place[nt.type]));
  burst(nt.x, nt.y + 10, '#c9a26b', 8, 90); sfx(400, .15, 'triangle', .05, 400);
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const { x, y } = toLocal(e);
  for (let i = btns.length - 1; i >= 0; i--) {
    const b = btns[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { if (b.fn) b.fn(); return; }
  }
  if (scene === 'play') tapGrid(x, y);
});
cv.addEventListener('pointermove', e => {
  if (scene !== 'play' || e.pointerType === 'touch') return;
  const { x, y } = toLocal(e); g.hover = gridCell(x, y);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (scene !== 'play' || g.result) return;
  const k = e.key;
  if (g.modals.length) { if (k === 'Enter' || k === ' ' || k === 'Escape') { e.preventDefault(); closeModal(); } return; }
  if (k === 'Escape' && g.moving) { g.moving = null; return; }
  if (k === 'p' || k === 'P' || k === 'Escape') g.paused = !g.paused;
  else if (k === ' ' || k === 'Enter') { e.preventDefault(); nextWaveNow(); }
  else if (k === 'f' || k === 'F') g.speed = g.speed % 3 + 1;
  else if (k >= '1' && k <= '6' && rabbitUnlocked(+k - 1)) { g.armed = +k - 1; g.sel = null; g.moving = null; }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && scene === 'play' && g && !g.result) g.paused = true; });

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  update(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#2b6a2f'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(sc * dpr, 0, 0, sc * dpr, ox * dpr, oy * dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  btns.length = 0;
  if (scene === 'menu') drawMenu(); else if (scene === 'story') drawStory(); else drawPlay();
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
