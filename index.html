  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && Array.isArray(s.stars)) save = Object.assign(save, s);

// a lost game must never come back as a run to continue
if (save.run && !(save.run.lives > 0)) save.run = null;

  // older saves unlocked TOWERS by clearing levels
  save.TOWERS = [0, 1];

}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const cleared = i => save.stars[i] > 0;
const levelUnlocked = i => i === 0 || cleared(i - 1);
const towerUnlocked = i => save.TOWERS.includes(i);
const totalStars = () => save.stars.reduce((a, b) => a + b, 0);

// ---------- audio ----------
let ac = null; const lastSfx = {};
function sfx(f, d = .08, type = 'square', vol = .04, slide = 0, key) {
  if (save.muted) return;
  const now = performance.now();
  if (key) { if (now - (lastSfx[key] || 0) < 60) return; lastSfx[key] = now; }
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(gn); gn.connect(ac.destination); o.start(); o.stop(t + d);
  } catch (e) {}
}

function rnd(a, b, c) {
  let h = (a * 374761393 + b * 668265263 + c * 1274126177) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function mkLevel(def, idx) {
  const wps = def.wps, theme = THEMES[idx];
  const pts = wps.map(([c, r]) => ({ x: c * CS + CS / 2, y: GY + r * CS + CS / 2 }));
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const cells = new Set();
  for (let i = 1; i < wps.length; i++) {
    const [a, b] = wps[i - 1], [c, d] = wps[i];
    const n = Math.max(Math.abs(c - a), Math.abs(d - b));
    for (let k = 0; k <= n; k++) cells.add((a + Math.sign(c - a) * k) + ',' + (b + Math.sign(d - b) * k));
  }
  const blocked = new Map(def.blocked.map(([c, r, k]) => [c + ',' + r, k]));
  const deco = [], pal = ['#ffffff', '#ffe14d', '#ff8fb8', '#c9a0ff'];
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    const key = c + ',' + r;
    if (cells.has(key) || blocked.has(key)) continue;
    const x0 = c * CS, y0 = GY + r * CS, q = rnd(c, r, idx + 1);
    if (q < .1) deco.push({ kind: theme.deco[0], x: x0 + 16 + rnd(c, r, 2) * 28, y: y0 + 16 + rnd(c, r, 3) * 28 });
    else if (q < .2) deco.push({ kind: theme.deco[1], x: x0 + 14 + rnd(c, r, 4) * 32, y: y0 + 14 + rnd(c, r, 5) * 32, col: pal[(rnd(c, r, 6) * 4) | 0] });
    if (rnd(c, r, 9) < .35) deco.push({ kind: 'crack', x: x0 + 10 + rnd(c, r, 7) * 40, y: y0 + 10 + rnd(c, r, 8) * 40 });
  }
  const len = cum[cum.length - 1], pebbles = [];
  const tmp = {};
  for (let d = 10, i = 0; d < len; d += 21, i++) {
    posAt({ pts, cum }, d, tmp);
    pebbles.push({ x: tmp.x + (rnd(i, 1, idx) - .5) * 28, y: tmp.y + (rnd(i, 2, idx) - .5) * 28, r: 1.6 + rnd(i, 3, idx) * 2.2 });
  }
  const last = pts[pts.length - 1];
  const exit = { x: Math.min(last.x, W - 24), y: Math.min(Math.max(last.y, GY + 24), PY - 24) };
  return { pts, cum, len, cells, blocked, deco, pebbles, exit };
}
function posAt(L, d, o) {
  const p = L.pts, c = L.cum; let i = 1;
  while (i < c.length - 1 && c[i] < d) i++;
  const t = (d - c[i - 1]) / (c[i] - c[i - 1]);
  o.x = p[i - 1].x + (p[i].x - p[i - 1].x) * t;
  o.y = p[i - 1].y + (p[i].y - p[i - 1].y) * t;
}

const specCache = new Map();
function parseSpec(s) {
  let p = specCache.get(s);
  if (!p) {
    const parts = s.split('+');
    p = { k: parts[0], seg: parts.includes('seg'), plat: parts.includes('plat'), camo: parts.includes('camo') };
    specCache.set(s, p);
  }
  return p;
}
function buildWave(lv, n) {
  const def = LEVELS[lv], avail = def.specs.filter(s => s[0] <= n && (s[3] == null || n <= s[3]));
  const count = Math.round(Math.min(BAL.cap, BAL.count0 + BAL.countN * (n - 1) + lv * 2));
  const sumW = avail.reduce((a, s) => a + s[2], 0), list = [];
  for (const [from, spec, w] of avail) {
    let k = Math.max(1, Math.round(count * w / sumW));
    if (from === n) k = Math.max(k, 5);
    for (let i = 0; i < k; i++) list.push(spec);
  }
  if (def.bosses[n]) list.push('boss:' + def.bosses[n]);
  return list;
}

  const R = TOWERS[t.type];
  const s = Object.assign({ camo: false, aura: false, splash: 0, slow: 0, stun: 0, strip: false, chain: 1, count: 1, pierce: 1, income: 0 }, R.base);
  if (t.rangeUp && s.range) s.range = RANGE_UP;
  for (let i = 0; i < t.lvl - 1; i++) R.ups[i].f(s);
  return s;
}
function heroStats(h) {
  const H = HEROES[h.key];
  const s = Object.assign({ camo: false, splash: 0, stun: 0, knock: 0, pierce: 1, melee: false, cdr: 1, dtype: H.dtype }, H.base);

  for (const k of h.items) ITEMS.find(it => it.key === k).f(s);
  return s;
}

function canHurt(e, dtype) {

  if (e.seg) return dtype === 'sharp' || dtype === 'heart';

}

function bossCounters(b) {
  const out = [];
  if (b.props.camo) out.push(3);
  TOWERS.forEach((R, i) => {
    if (!R.dtype || out.includes(i) || !canHurt(b.props, R.dtype)) return;
    if (R.dtype === b.weak) out.unshift(i);
  });
  TOWERS.forEach((R, i) => { if (R.dtype && !out.includes(i) && canHurt(b.props, R.dtype)) out.push(i); });
  return out.slice(0, 4);
}

// best free cell for a new hero: next to as much path as possible, a bit towards the middle
function heroSpot() {
  let best = null, bs = -1e9;
  const path = [...g.L.cells].map(k => k.split(',').map(Number));
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    if (!canBuild(c, r)) continue;
    let n = 0; for (const [a, b] of path) if (Math.hypot(a - c, b - r) <= 2.2) n++;
    n -= Math.abs(r - 6) * .4 + Math.abs(c - 4) * .2;
    if (n > bs) { bs = n; best = { c, r }; }
  }
  return best || { c: 0, r: 0 };
}

  ctx.fillStyle = 'rgba(20,10,0,.55)'; ctx.fillRect(0, 0, W, H);
  if (m.kind === 'intro') {
    const def = g.def, fin = BOSSES[def.bosses[def.waves]];
    card(30, 90, 480, 770, '#fff3d6', 22);
    txt('BANA ' + (g.lv + 1) + ' · ' + def.waves + ' VÅGOR', W / 2, 124, 15, '#8a6a3a', 'center', null);
    txt(def.name, W / 2, 158, 32, '#ff9b21');
    let y = para(def.story, 60, 198, 420, 16) + 14;
    txt('BOSSAR PÅ VÄGEN', W / 2, y, 14, '#c2410c', 'center', null);
    const ws = Object.keys(def.bosses).map(Number).sort((a, b) => a - b);
    ws.forEach((w, k) => {
      const x = W / 2 + (k - (ws.length - 1) / 2) * 86, b = BOSSES[def.bosses[w]];
      circ(x, y + 44, 26, '#fff', 2.5);
      drawPredator(b.animal, x, y + 46, .9);
      txt('VÅG ' + w, x, y + 84, 12, INK, 'center', null);
      const u = def.unlocks && def.unlocks[w];
      if (u != null) {
        drawTower(u, x, y + 118, -.5, 0, towerUnlocked(u) ? .5 : 1, .55, { lift: Math.abs(Math.sin(T * 4 + k)) * 4, sx: 1, sy: 1, ear: 0, blink: false });
        txt('+' + TOWERS[u].short, x, y + 144, 11, '#2f9e44', 'center', null);
      }
    });
    y += def.unlocks ? 166 : 104;
    if (def.unlocks) { y = para('Besegra bossarna så får du ritningar till nya torn!', W / 2, y, 400, 13, '#2f9e44', 'center') + 10; }
    drawBossBalloon(110, y + 60 + Math.sin(T * 1.5) * 4, fin, fin.props, false, 1.05);
    txt('SLUTBOSS: ' + fin.name, 180, y + 10, 15, INK, 'left', null);
    ctx.fillStyle = '#2a1c44'; ctx.strokeStyle = '#c77dff'; ctx.lineWidth = 2.5; rr(176, y + 24, 304, 54, 12); ctx.fill(); ctx.stroke();
    para('"' + fin.taunt + '"', 188, y + 42, 282, 13, '#5a3a1a');
    para('Kuriosa: ' + fin.fact, 180, y + 94, 300, 12, '#8a6a3a');
    btn(120, 778, 300, 66, 'TILL STRID!', '#3fbf5a', closeModal, { size: 24 });
  } else if (m.kind === 'hero') {
    card(20, 90, 500, 780, '#fff3d6', 22);
    txt('VÄLJ HJÄLTE', W / 2, 130, 30, '#ff5fa2');
    txt('Hjälten går upp i nivå, har förmågor och kan flyttas gratis mellan vågorna.', W / 2, 162, 12, '#8a6a3a', 'center', null);
    HERO_KEYS.forEach((key, i) => {
      const H = HEROES[key], un = heroUnlocked(key), y = 184 + i * 222;
      btns.push({ x: 36, y, w: 468, h: 210, fn: un ? () => {
        closeModal(); const h = setHero(key); g.sel = null; burst(h.x, h.y, H.color, 16);
        say(h, pick(H.lines.pick), 2.6); sfx(700, .3, 'triangle', .06, 500);
      } : null });
      card(36, y, 468, 210, un ? '#ffffff' : '#d9dce4', 18);
      ctx.save(); if (!un) ctx.globalAlpha = .35;
      ctx.fillStyle = H.color + '33'; ctx.beginPath(); ctx.arc(112, y + 105, 70, 0, 7); ctx.fill();
      drawHero(key, 112, y + 118, -.3 + Math.sin(T) * .3, 2.3, { lift: un ? Math.abs(Math.sin(T * 2 + i)) * 6 : 0, blink: ((T + i) % 3.7) < .13, seed: i });
      ctx.restore();
      txt(H.name, 200, y + 30, 26, un ? H.color : '#8a8f9c', 'left');
      txt(H.title.toUpperCase(), 200, y + 58, 13, un ? '#8a6a3a' : '#8a8f9c', 'left', null);
      if (un) {
        let yy = para(H.desc, 200, y + 82, 290, 13, INK);
        txt('Q · ' + H.q.name, 200, yy + 10, 12, '#5a3a8a', 'left', null);
        txt('R · ' + H.r.name + ' (nivå ' + ULT_LVL + ')', 200, yy + 30, 12, '#5a3a8a', 'left', null);
        btn(360, y + 160, 132, 40, 'VÄLJ', '#3fbf5a', btns[btns.length - 1].fn, { size: 18 });
      } else {
        txt('🔒 LÅST', 200, y + 100, 18, '#6c7388', 'left', null);
        txt('Klara ' + LEVELS[H.unlock].name + ' för att låsa upp', 200, y + 128, 12, '#6c7388', 'left', null);
      }
    });
  } else if (m.kind === 'tip') {
    const tip = TIPS[m.key], p = parseSpec(tip.spec);
    card(40, 150, 460, 640, '#fff3d6', 22);
    txt('NY MINION!', W / 2, 192, 30, '#ff5a5a');
    drawBalloon(W / 2, 285 + Math.sin(T * 2) * 5, 34, KINDS[p.k].color, Object.assign({ kind: p.k }, p), false, 1.8);
    txt(tip.title, W / 2, 358, 22, INK, 'center', null);
    let y = para(tip.text, W / 2, 392, 400, 16, INK, 'center');
    para('(' + tip.joke + ')', W / 2, y + 8, 400, 13, '#8a6a3a', 'center');
    txt('BRA TORN MOT DEN', W / 2, 548, 14, '#2f9e44', 'center', null);
    towerRow(tip.good, 604);
    btn(130, 700, 280, 64, 'UPPFATTAT!', '#3fbf5a', closeModal, { size: 22 });
  } else if (m.kind === 'boss') {
    const b = BOSSES[m.key];
    card(40, 130, 460, 680, '#fff3d6', 22);
    txt(g.state === 'prep' && g.next.includes('boss:' + m.key) ? 'BOSSEN KOMMER!' : 'BOSS', W / 2, 170, 28, '#ff5a5a');
    drawBossBalloon(W / 2, 270 + Math.sin(T * 1.5) * 4, b, b.props, false, 1.5);
    txt(b.name, W / 2, 354, 22, INK, 'center', null);
    let y = 392;
    for (const line of bossTraits(b)) { txt('• ' + line, 72, y, 15, INK, 'left', null); y += 26; }
    txt('Bossbonus: ¢ ' + b.gold, 72, y + 6, 15, '#8a5a00', 'left', null);
    txt('BRA TORN MOT BOSSEN', W / 2, y + 46, 14, '#2f9e44', 'center', null);
    towerRow(bossCounters(b), y + 100);
    btn(130, 720, 280, 64, 'JAG ÄR REDO!', '#3fbf5a', closeModal, { size: 22 });
  } else if (m.kind === 'unlock') {
    const R = TOWERS[m.i];
    card(50, 200, 440, 520, '#fff3d6', 22);
    txt('NYTT TORN!', W / 2, 244, 28, '#3fbf5a');
    drawTower(m.i, W / 2, 350 - Math.abs(Math.sin(T * 4)) * 14, -.5, 0, 1, 2.2, { lift: 0, sx: 1, sy: 1, ear: Math.sin(T * 5) * .12, blink: (T % 3) < .15 });
    txt(R.name, W / 2, 450, 24, INK, 'center', null);
    let y = para(R.desc, W / 2, 486, 360, 15, '#5a3a1a', 'center');
    para(m.boss.short + ' tappade ritningen när ballongen sprack. Nu är den din!', W / 2, y + 12, 360, 13, '#8a6a3a', 'center');
    txt('Max ' + R.max + ' st per bana', W / 2, y + 60, 13, '#2f7d32', 'center', null);
    btn(130, 630, 280, 64, 'VÄLKOMMEN!', '#3fbf5a', closeModal, { size: 22 });
  }
}
function drawOverlayBase(title, color) {
  btns.push({ x: 0, y: 0, w: W, h: H, fn: null });
  ctx.fillStyle = 'rgba(20,10,0,.6)'; ctx.fillRect(0, 0, W, H);
  card(50, 140, 440, 650, '#fff3d6', 22);
  txt(title, W / 2, 195, title.length > 16 ? 26 : 32, color);
}
function drawPause() {
  drawOverlayBase('PAUSAD', '#4d8dff');
  txt('Ingenjörerna tar en fikapaus. Spelet sparas efter varje våg.', W / 2, 240, 13, '#8a6a3a', 'center', null);
  const nb = nextBoss();
  btn(110, 270, 320, 66, 'FORTSÄTT', '#3fbf5a', () => { g.paused = false; }, { size: 22 });
  btn(110, 350, 320, 66, 'NÄSTA BOSS', '#c0713a', () => { g.paused = false; if (nb) g.modals.push({ kind: 'boss', key: nb.key }); }, { size: 22, disabled: !nb });
  btn(110, 430, 320, 66, 'AUTOSTART: ' + (save.auto ? 'PÅ' : 'AV'), save.auto ? '#7d8cff' : '#8a8f9c', () => { save.auto = !save.auto; persist(); }, { size: 20 });
  txt(save.auto ? 'Vågorna startar själva efter nedräkningen.' : 'Du startar varje våg själv med VÅG-knappen.', W / 2, 512, 12, '#8a6a3a', 'center', null);
  btn(110, 530, 320, 66, 'STARTA OM', '#ff9b21', () => startLevel(g.lv), { size: 22 });
  btn(110, 610, 320, 66, 'MENY', '#4d8dff', () => { scene = 'menu'; }, { size: 22 });
}
function drawEnd() {
  const win = endInfo.win, fin = BOSSES[g.def.bosses[g.total]];
  drawOverlayBase(win ? g.def.name + ' RÄDDAD!' : 'KRISTALLERNA ÄR SLUT!', win ? '#3fbf5a' : '#ff5a5a');
  let y = 240;
  if (win) {
    for (let s = 0; s < 3; s++) {
      const on = s < endInfo.stars, sz = on ? 62 + Math.sin(T * 4 + s) * 4 : 62;
      txt('★', W / 2 + (s - 1) * 70, y + 20, sz, on ? '#ffd23b' : '#d9cdb0');
    }
    txt(g.lives + ' kristaller kvar efter ' + g.total + ' vågor', W / 2, y + 66, 16, '#8a5a2b', 'center', null);
    drawBossBalloon(W / 2, y + 170, fin, {}, false, 1.1);
    y = para('"' + fin.defeat + '" – ' + fin.short, W / 2, y + 250, 360, 14, '#8a6a3a', 'center') + 10;
    if (g.lv === LEVELS.length - 1) { y = para('Månkristallen är räddad och staden lyser igen. Grattis, kristallväktare!', W / 2, y + 10, 380, 17, INK, 'center') + 10; }
  } else {
    const b = g.lastBoss;
    txt('Du kom till våg ' + g.wave + ' av ' + g.total, W / 2, y + 4, 16, '#8a5a2b', 'center', null);
    drawBossBalloon(W / 2, y + 90 + Math.sin(T * 2) * 4, b, {}, false, 1.1);
    ctx.fillStyle = '#2a1c44'; ctx.strokeStyle = '#c77dff'; ctx.lineWidth = 2.5; rr(W / 2 + 40, y + 24, 170, 46, 12); ctx.fill(); ctx.stroke();
    para(b.win, W / 2 + 125, y + 40, 150, 13, INK, 'center');
    txt('TIPS', W / 2, y + 170, 16, '#c2410c', 'center', null);
    y = para(endInfo.tip, W / 2, y + 198, 360, 16, INK, 'center') + 10;
  }
  y = Math.max(y + 10, 540);
  const toMenu = () => { scene = 'menu'; g = null; };
  if (!win) {
    // a lost game is over: the run is gone and the player goes back to the map
    txt('Staden har slocknat. Börja om från våg 1!', W / 2, y, 13, '#8a6a3a', 'center', null);
    btn(110, y + 30, 320, 70, 'TILL MENYN', '#4d8dff', toMenu, { size: 23 });
    return;
  }
  if (g.lv + 1 < LEVELS.length) { btn(110, y, 320, 60, 'NÄSTA BANA', '#3fbf5a', () => startLevel(g.lv + 1), { size: 21 }); y += 72; }
  btn(110, y, 320, 60, 'SPELA IGEN', '#ff9b21', () => startLevel(g.lv), { size: 21 }); y += 72;
  btn(110, y, 320, 60, 'MENY', '#4d8dff', toMenu, { size: 21 });
}

// ---------- input ----------
function toLocal(e) { return { x: (e.clientX - ox) / sc, y: (e.clientY - oy) / sc }; }
function gridCell(x, y) {
  if (y < GY || y >= PY || x < 0 || x >= W) return null;
  return { c: Math.floor(x / CS), r: Math.floor((y - GY) / CS) };
}
function tapGrid(x, y) {
  const cell = gridCell(x, y); if (!cell) return;
  const { c, r } = cell; g.hover = cell;
  if (g.heroMove) {
    const h = g.hero;
    if (h.c === c && h.r === r) { g.heroMove = false; return; }
    if (!canBuild(c, r)) { sfx(150, .1, 'sawtooth'); return; }
    burst(h.x, h.y + 10, h.H.color, 6, 80);
    Object.assign(h, { c, r, x: c * CS + CS / 2, y: GY + r * CS + CS / 2, hop: .5 });
    g.heroMove = false;
    burst(h.x, h.y + 10, h.H.color, 10, 100); say(h, pick(h.H.lines.move)); sfx(600, .15, 'triangle', .05, 400);
    return;
  }
  if (g.moving) {
    const t = g.moving, mc = moveCost(t);
    if (t.c === c && t.r === r) { g.moving = null; return; }
    if (!canBuild(c, r)) { sfx(150, .1, 'sawtooth'); return; }
    if (g.gold < mc) { pop(x, y, 'FÖR LITE ¢', '#ff8a8a'); sfx(150, .12, 'sawtooth'); g.moving = null; return; }
    g.gold -= mc; burst(t.x, t.y + 10, '#c9a26b', 6, 80);
    Object.assign(t, { c, r, x: c * CS + CS / 2, y: GY + r * CS + CS / 2, hop: .5, cd: .5 });
    g.moving = null; g.sel = t;
    burst(t.x, t.y + 10, '#c9a26b', 8, 90); say(t, pick(LINES.move)); sfx(500, .15, 'triangle', .05, 300);
    return;
  }
  if (g.hero && g.hero.c === c && g.hero.r === r) { g.sel = g.hero; g.armed = -1; g.hero.hop = .4; sfx(620, .05); return; }
  const t = g.towers.find(t => t.c === c && t.r === r);
  if (t) { g.sel = t; g.armed = -1; t.hop = .4; sfx(520, .05); return; }
  if (g.armed < 0) { g.sel = null; return; }
  const R = TOWERS[g.armed];
  if (!canBuild(c, r)) { sfx(150, .1, 'sawtooth'); return; }
  if (countOf(g.armed) >= R.max) {
    pop(x, y, 'MAX ' + R.max + ' ' + R.short + '!', '#ff8a8a'); sfx(150, .12, 'sawtooth');
    const same = g.towers.find(o => o.type === g.armed); if (same) say(same, pick(LINES.full));
    return;
  }
  if (g.gold < R.cost) { pop(x, y, 'FÖR LITE ¢', '#ff8a8a'); sfx(150, .12, 'sawtooth'); return; }
  g.gold -= R.cost;
  const nt = { type: g.armed, c, r, x: c * CS + CS / 2, y: GY + r * CS + CS / 2, lvl: 1, cd: 0, ang: -0.5, invested: R.cost, mode: 'first', sees: false,
    name: pick(NAMES), pops: 0, seed: Math.random() * 10, kick: 0, hop: .5, rangeUp: false };
  nt.s = stats(nt); g.towers.push(nt);
  say(nt, pick(LINES.place[nt.type]));
  burst(nt.x, nt.y + 10, '#c9a26b', 8, 90); sfx(400, .15, 'triangle', .05, 400);
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const { x, y } = toLocal(e);
  for (let i = btns.length - 1; i >= 0; i--) {
    const b = btns[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { if (b.fn) b.fn(); return; }
  }
  if (scene === 'play') tapGrid(x, y);
});
cv.addEventListener('pointermove', e => {
  if (scene !== 'play' || e.pointerType === 'touch') return;
  const { x, y } = toLocal(e); g.hover = gridCell(x, y);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (scene !== 'play' || g.result) return;
  const k = e.key;
  if (g.modals.length) {
    // the hero has to be picked by tapping a card
    if (g.modals[0].kind !== 'hero' && (k === 'Enter' || k === ' ' || k === 'Escape')) { e.preventDefault(); closeModal(); }
    return;
  }
  if (k === 'Escape' && (g.moving || g.heroMove)) { g.moving = null; g.heroMove = false; return; }
  if (k === 'p' || k === 'P' || k === 'Escape') g.paused = !g.paused;
  else if (k === ' ' || k === 'Enter') { e.preventDefault(); nextWaveNow(); }
  else if (k === 'f' || k === 'F') g.speed = g.speed % 3 + 1;
  else if (k === 'q' || k === 'Q') cast('q');
  else if (k === 'r' || k === 'R') cast('r');
  else if (k >= '1' && k <= '6' && towerUnlocked(+k - 1)) { g.armed = +k - 1; g.sel = null; g.moving = null; }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && scene === 'play' && g && !g.result) g.paused = true; });

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  update(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0e0818'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(sc * dpr, 0, 0, sc * dpr, ox * dpr, oy * dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  btns.length = 0;
  if (scene === 'menu') drawMenu(); else if (scene === 'story') drawStory(); else drawPlay();
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
